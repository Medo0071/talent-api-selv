name: CI

on:
    push:
        branches: [main]

jobs:
    test:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4


            - uses: actions/setup-python@v5
              with: 
                python-version: "3.12"


            - run: pip install -r requirements.txt pytest httpx pyyaml

            - run: python -m pytest tests/ -v

